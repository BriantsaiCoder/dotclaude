name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ~/.agents 不存在於本 repo 的 CI 環境，所以 94 個 symlink 全是斷鏈。
      # 這是預期的：repo-integrity.sh 只驗 symlink 的「形狀」不驗目標存在，
      # 因為形狀錯（絕對路徑、指到別的 kind、改名沒重連）才是會靜默換掉
      # skill 內容的那一種失效。目標存在性由本機 `agents-sync --doctor` 負責。
      # ripgrep 不可省：repo-integrity.sh 大量以 `rg` 斷言，缺它時不會報錯而是
      # 依斷言極性一半 FAIL、一半假 PASS——2026-08-01 run 30671830610 實證。
      # 這裡不寫死處數：註解一旦複述腳本內容就會漂移（原本寫 12，實際已是 21）。
      - name: 安裝 shellcheck 與 ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck ripgrep

      # step 名稱不複述檢查項目，同上理由——檢查了什麼由腳本自己的輸出負責。
      - name: repo 完整性
        run: bash tests/repo-integrity.sh

      # 這個 hook 是 [T0-3] force-push 防線的完整實作。2026-07-29 三家 config
      # 分離後它不再是指向 ~/.agents 的 wrapper——repo-integrity.sh 第 5 節反過來
      # 禁止 hooks/ 出現 symlink，所以本 repo 擁有自己那一份。
      # CI 環境沒有 ~/.agents，無法比對三份副本是否一致；那由本機
      # ~/.agents/hooks/drift-check.sh 的 parity 檢查負責（SessionStart 觸發）。
      # 這裡只確認防線沒有退化成空殼或壞語法。
      # 錨點選判定變數而非註解標記：只驗 '[T0-3]' 的話，一個
      # `# [T0-3]` + `exit 0` 的空殼也會 PASS——探針就偵測不到它自稱偵測的退化。
      # has_force / other_option 是實際判定 force 變體與非 canonical lease option 的變數，
      # main|master 是保護分支判定；三者任一消失都代表防線真的被換掉了。
      - name: guard-git-push 防線未退化
        run: |
          set -euo pipefail
          f=hooks/guard-git-push.sh
          test -f "$f" || { echo "缺少 $f"; exit 1; }
          for anchor in '\[T0-3\]' 'has_force' 'other_option' 'main|master'; do
            grep -q "$anchor" "$f" \
              || { echo "$f 缺少判定錨點 $anchor——防線可能已被空殼取代"; exit 1; }
          done
          bash -n "$f" || { echo "$f 語法錯誤"; exit 1; }
          echo "OK: $f 存在、四個判定錨點齊備、語法正確"
