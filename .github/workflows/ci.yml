name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ~/.agents 不存在於本 repo 的 CI 環境，所以 94 個 symlink 全是斷鏈。
      # 這是預期的：repo-integrity.sh 只驗 symlink 的「形狀」不驗目標存在，
      # 因為形狀錯（絕對路徑、指到別的 kind、改名沒重連）才是會靜默換掉
      # skill 內容的那一種失效。目標存在性由本機 `agents-sync --doctor` 負責。
      # ripgrep 不可省：repo-integrity.sh 大量以 `rg` 斷言。缺它時腳本開頭的全域守衛
      # 印一條 FAIL 就中止（#57），不再有任何斷言依極性假綠。
      # 這裡不寫死處數：註解一旦複述腳本內容就會漂移（原本寫 12，實際已是 21）。
      #
      # update 失敗不致命。runner image 預載第三方 apt repo，其中任何一家掛掉都會讓
      # apt-get update 回 100；原本的 `&&` 於是讓整步死掉，後面兩步 skipped——
      # 2026-08-27 run 33035176589 就是這樣紅的（packages.microsoft.com 兩個 repo
      # 同時 403），那次 run 對 repo 內容零訊號：不是檢查發現問題，是檢查沒機會跑。
      # update 失敗仍會刷新其他 repo 的索引，所以續行。守衛改由下面的迴圈承擔：
      # 要保證的是工具在不在，而 update 的 exit code 反映的是「所有 apt repo
      # 都健康」——那是個更嚴格、且與本 repo 無關的條件，拿它當守衛就是誤擋。
      # install 本身仍是致命的，只有 update 被降級。
      #
      # 兩個工具缺席的後果不同，2026-08-27 於本 repo 實測（不記數字，理由同上一段）：
      #   缺 ripgrep    → suite 已經會紅（08-27 實測如此）。#57 起腳本開頭的全域守衛
      #                   缺 rg 即整份中止，機制與歷史見 tests/repo-integrity.sh 檔頭。
      #                   這裡擋它是 defence-in-depth，並讓訊息指名工具，而不是
      #                   讓人從一堆 FAIL 斷言裡回推工具沒裝。
      #   缺 shellcheck → suite 仍然是綠的。第 4 節印 SKIP 不印 FAIL，覆蓋率靜默
      #                   流失而沒有人會發現——這才是本步驟真正堵住的洞。
      - name: 工具就緒
        run: |
          set -euo pipefail
          sudo apt-get update -qq || echo "apt-get update 失敗，續行（見上方註解）"
          sudo apt-get install -y -qq shellcheck ripgrep
          # 逐項硬擋並指名缺哪一個。沉默的 exit 1 正是本次要消滅的失效樣態，
          # 同一個 job 下方的守衛步驟也是每條失敗路徑都 echo 理由。
          # command -v 不重導向：成功時把解析到的路徑印進 log，那是這一步唯一的
          # provenance 訊號（工具究竟來自 apt 還是 runner image 預裝）。
          for t in shellcheck rg; do
            command -v "$t" || { echo "缺少 $t——不讓後續斷言在缺工具的情況下執行，理由見上方註解"; exit 1; }
          done

      # step 名稱不複述檢查項目，同上理由——檢查了什麼由腳本自己的輸出負責。
      - name: repo 完整性
        run: bash tests/repo-integrity.sh

      # 這個 hook 是 [T0-3] force-push 防線的完整實作。2026-07-29 三家 config
      # 分離後它不再是指向 ~/.agents 的 wrapper——repo-integrity.sh 第 5 節反過來
      # 禁止 hooks/ 出現 symlink，所以本 repo 擁有自己那一份。
      # CI 環境沒有 ~/.agents，無法比對三份副本是否一致；那由本機
      # ~/.agents/hooks/drift-check.sh 的 parity 檢查負責（SessionStart 觸發）。
      # 這裡只確認防線沒有退化成空殼或壞語法。
      # 錨點選判定變數而非註解標記：只驗 '[T0-3]' 的話，一個
      # `# [T0-3]` + `exit 0` 的空殼也會 PASS——探針就偵測不到它自稱偵測的退化。
      # has_force / other_option 是實際判定 force 變體與非 canonical lease option 的變數，
      # main|master 是保護分支判定；三者任一消失都代表防線真的被換掉了。
      - name: guard-git-push 防線未退化
        run: |
          set -euo pipefail
          f=hooks/guard-git-push.sh
          test -f "$f" || { echo "缺少 $f"; exit 1; }
          for anchor in '\[T0-3\]' 'has_force' 'other_option' 'main|master'; do
            grep -q "$anchor" "$f" \
              || { echo "$f 缺少判定錨點 $anchor——防線可能已被空殼取代"; exit 1; }
          done
          bash -n "$f" || { echo "$f 語法錯誤"; exit 1; }
          echo "OK: $f 存在、四個判定錨點齊備、語法正確"
